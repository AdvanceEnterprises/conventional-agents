name: lint-docs

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/lint-docs.yml"
      - "docs/decisions/ADR-*.md"
      - "docs/decisions/.markdownlint.yml"
      - "docs/specifications/FS-*.md"
      - "docs/specifications/.markdownlint.yml"
      - "docs/change-plans/PLAN-*.md"
      - "docs/change-plans/.markdownlint.yml"
      - "workflows/*.md"
      - "workflows/.markdownlint.yml"
      - "guidelines/**/*.md"
      - "skills/**/*.md"
      - "templates/**/*.md"
      - "integrations/*.md"
      - "runbooks/**/*.md"
      - "roles/*.md"
      - "AGENTS.md"
      - "README.md"
      - "INTEGRATION.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "scripts/**/*"
      - "test/**/*.bats"
  pull_request:
    branches: [trunk]
    paths:
      - ".github/workflows/lint-docs.yml"
      - "docs/decisions/ADR-*.md"
      - "docs/decisions/.markdownlint.yml"
      - "docs/specifications/FS-*.md"
      - "docs/specifications/.markdownlint.yml"
      - "docs/change-plans/PLAN-*.md"
      - "docs/change-plans/.markdownlint.yml"
      - "workflows/*.md"
      - "workflows/.markdownlint.yml"
      - "guidelines/**/*.md"
      - "skills/**/*.md"
      - "templates/**/*.md"
      - "integrations/*.md"
      - "runbooks/**/*.md"
      - "roles/*.md"
      - "AGENTS.md"
      - "README.md"
      - "INTEGRATION.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "scripts/**/*"
      - "test/**/*.bats"

jobs:
  lint-adrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/decisions/ADR-*.md"

  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/specifications/FS-*.md"

  lint-change-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/change-plans/PLAN-*.md"

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "workflows/*.md"

  lint-docs-widened:
    # Widened lint coverage: per FS-0022 §4, this is the lint chain that catches
    # drift across the full corpus (guidelines/, skills/, templates/, integrations/,
    # roles/, and root-level docs). Catches mechanical whitespace issues, missing
    # code-fence languages, and structural problems that the original four-glob chain
    # would not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run widened markdownlint chain
        run: npm run lint:docs
      - name: Confirm widened lint passed
        run: test $? -eq 0

  check-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required. The ADR-0026 approval-provenance check reads
          # `git log` for the Approved-By: trailer on the commit that last touched
          # each PLAN, and `git show <sha>:<plan>` to compare the approved touches:
          # set against the current one. A shallow clone has neither, so every
          # approval lookup fails and every reserved path reports unapproved.
          fetch-depth: 0
      - name: Check FS/PLAN status consistency
        run: bash scripts/check-status.sh

  check-freshness:
    # FS-0027: every governed doc under workflows/ and guidelines/** must carry
    # an updated: front-matter field (hard); docs older than 90d are reported
    # (soft, DOC_STALE_DAYS override). Additive gate — see scripts/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow/guideline doc freshness
        run: npm run check:freshness

  lint-cross-repo:
    # cross-repo-lint.sh, wired per #85. On pull_request this audits the
    # PR's own commits for FS-0017 attribution-trailer conformance; on push
    # to trunk it audits the last 20 trunk commits (script default range).
    #
    # CA_REPO_DIRS is restricted to the workspace because the default
    # GITHUB_TOKEN cannot check out sibling repos — the full three-repo
    # sweep runs in the maintenance tick, which holds all three checkouts
    # on disk. This job is the fail-closed enforcement point for the
    # calling repo's own agent-authored commits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch default branch ref
        run: git fetch --no-tags origin trunk
      - name: Cross-repo lint (this repo)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export COMMIT_RANGE="origin/${{ github.base_ref }}..HEAD"
          fi
          npm run lint:cross-repo
        env:
          CA_REPO_DIRS: ${{ github.workspace }}

  current-state-update:
    # ADR-0030 rule 3, per FS-0022 §3: an ADR that changes a rule must modify the
    # current-state document carrying that rule in the same change. CI-only because it
    # needs the change set — check-status.sh must stay runnable against a working tree
    # with no diff context.
    #
    # Runs on pull_request only. On a push to trunk the merge has happened and there is
    # no base to compare against that means anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history; the check diffs against the base ref
      - name: Check ADR-0030 rule 3
        run: bash scripts/check-current-state.sh "origin/${{ github.base_ref }}"

  test-bats:
    # Per FS-0022 §6, npm test runs the bats suites that were inert since the
    # repo's beginning. ROLE_CONTRACT's pre-commit testing gate relies on this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # suites invoke check-status.sh; see check-status job
          # Check out the real branch head, not GitHub's synthetic merge commit.
          # On pull_request, GitHub fabricates a "Merge <head> into <base>" commit
          # authored by the repository owner's GitHub-registered email. FS-0017's
          # commit-attribution suite inspects author emails and correctly rejected
          # it as an unknown actor — it is a commit nobody wrote, and asserting
          # against it tests GitHub rather than this repository.
          # Empty on push events, where checkout falls back to its default.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats and ripgrep
        # ripgrep is not preinstalled on GitHub runners and several suites call it
        # directly (rg -U, rg -A). run-bats.sh fails loudly if it is missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep
      - name: Run bats suites
        run: npm test
      - name: Confirm bats passed
        run: test $? -eq 0

# noop: retrigger CI
