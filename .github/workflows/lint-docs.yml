name: lint-docs

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/lint-docs.yml"
      - "docs/decisions/ADR-*.md"
      - "docs/decisions/.markdownlint.yml"
      - "docs/specifications/FS-*.md"
      - "docs/specifications/.markdownlint.yml"
      - "docs/change-plans/PLAN-*.md"
      - "docs/change-plans/.markdownlint.yml"
      - "workflows/*.md"
      - "workflows/.markdownlint.yml"
      - "guidelines/**/*.md"
      - "skills/**/*.md"
      - "templates/**/*.md"
      - "integrations/**/*.md"
      - "runbooks/**/*.md"
      - "roles/*.md"
      - "AGENTS.md"
      - "README.md"
      - "INTEGRATION.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "scripts/**/*"
      - "test/**/*.bats"
  # No base-branch filter on pull_request (per #139): stacked PRs whose base is
  # a non-trunk branch must receive the same governance signal as trunk-based
  # PRs. A green-looking stacked PR must not mean "no governance checks ran".
  # Safe for forked/untrusted PRs: this workflow uses no secrets and no
  # pull_request_target, so removing the filter does not broaden secret
  # exposure — fork PRs still run with the read-only default token.
  pull_request:
    paths:
      - ".github/workflows/lint-docs.yml"
      - "docs/decisions/ADR-*.md"
      - "docs/decisions/.markdownlint.yml"
      - "docs/specifications/FS-*.md"
      - "docs/specifications/.markdownlint.yml"
      - "docs/change-plans/PLAN-*.md"
      - "docs/change-plans/.markdownlint.yml"
      - "workflows/*.md"
      - "workflows/.markdownlint.yml"
      - "guidelines/**/*.md"
      - "skills/**/*.md"
      - "templates/**/*.md"
      - "integrations/**/*.md"
      - "runbooks/**/*.md"
      - "roles/*.md"
      - "AGENTS.md"
      - "README.md"
      - "INTEGRATION.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "scripts/**/*"
      - "test/**/*.bats"

# Spend guards (CI-refactor mitigation for the recurring Actions billing
# condition — feral-fleet #207). `concurrency` cancels a superseded generation
# when the same ref is pushed again while a run is in flight: without it, every
# rapid reviewer-feedback push launched a full 11-job workflow whose outcome the
# next push immediately superseded, consuming included Actions minutes in full.
# `timeout-minutes` on every job bounds a hung install step, which otherwise
# runs against GitHub's 360-minute default.
#
# The group key separates event kinds correctly without special-casing:
# `${{ github.ref }}` is `refs/heads/<branch>` on push and `refs/pull/N/merge`
# on pull_request, so a push and a PR run never cancel each other, and each
# PR's own superseded generations collapse.
#
# Deliberately NOT a `paths:` filter here: the governance gates are whole-corpus
# (`check-status.sh` reads every FS/PLAN/ADR regardless of the diff; gate
# coverage is FS-0022's subject, gate target resolution is ADR-0033's), so a
# filter that skips the workflow on non-matching diffs re-opens the exact
# fail-open shape FS-0024 was written to remove (see the setup note above).
# The guards below bound spend without weakening any gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-adrs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/decisions/ADR-*.md"

  lint-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/specifications/FS-*.md"

  lint-change-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "docs/change-plans/PLAN-*.md"

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: davidanson/markdownlint-cli2-action@v17
        with:
          globs: "workflows/*.md"

  lint-docs-widened:
    # Widened lint coverage: per FS-0022 §4, this is the lint chain that catches
    # drift across the full corpus (guidelines/, skills/, templates/, integrations/,
    # roles/, and root-level docs). Catches mechanical whitespace issues, missing
    # code-fence languages, and structural problems that the original four-glob chain
    # would not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts
      - name: Run widened markdownlint chain
        run: npm run lint:docs
      - name: Confirm widened lint passed
        run: test $? -eq 0

  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required. The ADR-0026 approval-provenance check reads
          # `git log` for the Approved-By: trailer on the commit that last touched
          # each PLAN, and `git show <sha>:<plan>` to compare the approved touches:
          # set against the current one. A shallow clone has neither, so every
          # approval lookup fails and every reserved path reports unapproved.
          fetch-depth: 0
      - name: Check FS/PLAN status consistency
        run: bash scripts/check-status.sh

  github-binding-audit:
    # FS-0029 adoption: the framework runs the non-mutating binding audit against
    # itself. A project number is an optional repository variable because the
    # framework must not ship a board identifier as instance data.
    #
    # This repository's default GITHUB_TOKEN permission is read-only on
    # contents and packages only (no issues), so the label audit's read of
    # repos/{repo}/labels 403s without an explicit issues:read grant here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit framework labels
        env:
          GH_TOKEN: ${{ github.token }}
          CA_GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash integrations/github/bin/gh-label-provision.sh --audit
      - name: Audit framework project board when configured
        if: vars.CA_GITHUB_PROJECT_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CA_GITHUB_REPOSITORY: ${{ github.repository }}
          CA_GITHUB_PROJECT_NUMBER: ${{ vars.CA_GITHUB_PROJECT_NUMBER }}
        run: bash integrations/github/bin/gh-board-audit.sh
      - name: Audit open PR governed-ID claims
        # FS-0040 SC-12: informational by design. Findings (non-strict) are
        # reported in the job log without failing it; only a run failure
        # (exit 2, e.g. unauthenticated gh or an API error) fails the step.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CA_GITHUB_REPOSITORY: ${{ github.repository }}
          CA_REST_MIN_INTERVAL: 0
        run: bash integrations/github/bin/gh-pr-claim-audit.sh --json

  check-freshness:
    # FS-0027: every governed doc under workflows/ and guidelines/** must carry
    # an updated: front-matter field (hard); docs older than 90d are reported
    # (soft, DOC_STALE_DAYS override). Additive gate — see scripts/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check workflow/guideline doc freshness
        run: npm run check:freshness
      - name: Check history-aware workflow/guideline freshness
        run: npm run check:freshness:history
      - name: Check status versus delivered implementation
        # FS-0041 report-only posture: the audit exits 1 when it reports
        # delivered-but-non-terminal pairs, which is the intended local/CI
        # diagnostic. Until the delivered pairs tracked by issue #188 are
        # reconciled by a human status PR, the step is non-gating in CI
        # (its output still prints); remove continue-on-error once the
        # corpus is clean so the check becomes a hard gate.
        continue-on-error: true
        run: npm run check:delivery

  lint-cross-repo:
    # cross-repo-lint.sh, wired per #85. On pull_request this audits the
    # PR's own commits for FS-0017 attribution-trailer conformance; on push
    # to trunk it audits the anchored post-release commits (newest v* tag,
    # per #141) or the last 20 trunk commits when no release tag exists.
    #
    # CA_REPO_DIRS is restricted to the workspace because the default
    # GITHUB_TOKEN cannot check out sibling repos — the full three-repo
    # sweep runs in the maintenance tick, which holds all three checkouts
    # on disk. This job is the fail-closed enforcement point for the
    # calling repo's own agent-authored commits.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch ref
        # Fetch the actual base ref, not just trunk: on a stacked PR the base
        # is a non-trunk branch, and COMMIT_RANGE below must resolve against
        # a ref that exists locally. On push events github.base_ref is empty,
        # so fall back to trunk; COMMIT_RANGE is left unset and
        # cross-repo-lint.sh's default range (origin/trunk~20..origin/trunk)
        # handles that case.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            git fetch --no-tags origin trunk
          fi
      - name: Cross-repo lint (this repo)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export COMMIT_RANGE="origin/${{ github.base_ref }}..HEAD"
          fi
          npm run lint:cross-repo
        env:
          CA_REPO_DIRS: ${{ github.workspace }}

  current-state-update:
    # ADR-0030 rule 3, per FS-0022 §3: an ADR that changes a rule must modify the
    # current-state document carrying that rule in the same change. CI-only because it
    # needs the change set — check-status.sh must stay runnable against a working tree
    # with no diff context.
    #
    # Runs on pull_request only. On a push to trunk the merge has happened and there is
    # no base to compare against that means anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history; the check diffs against the base ref
      - name: Check ADR-0030 rule 3
        run: bash scripts/check-current-state.sh "origin/${{ github.base_ref }}"

  test-bats:
    # Per FS-0022 §6, npm test runs the bats suites that were inert since the
    # repo's beginning. ROLE_CONTRACT's pre-commit testing gate relies on this.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # suites invoke check-status.sh; see check-status job
          # Check out the real branch head, not GitHub's synthetic merge commit.
          # On pull_request, GitHub fabricates a "Merge <head> into <base>" commit
          # authored by the repository owner's GitHub-registered email. FS-0017's
          # commit-attribution suite inspects author emails and correctly rejected
          # it as an unknown actor — it is a commit nobody wrote, and asserting
          # against it tests GitHub rather than this repository.
          # Empty on push events, where checkout falls back to its default.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats and ripgrep
        # ripgrep is not preinstalled on GitHub runners and several suites call it
        # directly (rg -U, rg -A). run-bats.sh fails loudly if it is missing.
        # python3-yaml (PyYAML) is required by scripts/bench-run.sh's card
        # validation (FS-0031); ubuntu-latest ships python3 but not PyYAML.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep python3-yaml
      - name: Run bats suites
        run: npm test
      - name: Confirm bats passed
        run: test $? -eq 0

  validation:
    # FS-0039 / issue #132: the hermetic local validation contract is the
    # benchmark prerequisite. This job invokes the exact npm entry point used
    # by maintainers locally; setup prepares dependencies and Git refs first.
    runs-on: ubuntu-latest
    # Bounds the most expensive job in this workflow (7m39s observed on
    # 598f9af): test-bats' 20 minutes plus headroom for the four setup and
    # gate steps above. Per the spend-guard rationale at the top of this file,
    # every job carries one so a hung install step cannot ride GitHub's
    # 360-minute default.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Test the real branch head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts
      - name: Prepare pull-request base ref
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Run canonical validation surface
        run: npm run validate
        env:
          CA_VALIDATION_LOG: ${{ runner.temp }}/conventional-agents-validation.log
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || 'HEAD~20..HEAD' }}
      - name: Upload canonical validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conventional-agents-validation-log
          path: ${{ runner.temp }}/conventional-agents-validation.log
          if-no-files-found: error

  claude-plugin-validate:
    # FS-0030 advisory: the Claude Code runtime binding's plugin manifest must
    # stay valid. This job is deliberately NON-BLOCKING (continue-on-error) —
    # `claude plugin validate` is not a Category 1 governance gate (ADR-0015,
    # FS-0030 Non-Goals). It runs for signal only; a failure here never blocks
    # a merge.
    runs-on: ubuntu-latest
    # Per the spend-guard rationale at the top of this file: every job carries a
    # bound so a hung `npx` install cannot ride GitHub's 360-minute default.
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Claude Code plugin manifest (advisory)
        run: |
          npx -y @anthropic-ai/claude-code plugin validate integrations/runtimes/claude-code
