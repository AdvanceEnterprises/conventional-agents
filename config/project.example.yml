# config/project.example.yml — GitHub Project board metadata template
#
# *** THIS IS A CONSUMER-COPY TEMPLATE, NOT FRAMEWORK CONFIGURATION ***
# The conventional-agents framework does not ship a populated config/project.yml
# for its own use. This file provides the required structure for programmatic
# board access via the `gh project` CLI.
#
# Copy this file to config/project.yml IN YOUR OWN REPOSITORY ROOT — not inside
# vendor/conventional-agents/ — and fill in values for your own project board.
# The real board metadata for the conventional-agents project lives in
# pack-protocol at config/boards/conventional-agents.yml.
#
# Schema is flat: no nested keys beyond the two-level field/options structure
# shown below. Each option ID is a GitHub-issued opaque string.

project:
  number: <your-project-number>
  id: "<your-project-id>"
  url: "https://github.com/orgs/<your-org>/projects/<your-project-number>"
  title: "<your-project-title>"
  owner: "<your-org>"

fields:
  status:
    id: "<your-status-field-id>"
    options:
      backlog: "<option-id>"
      approved: "<option-id>"
      in_progress: "<option-id>"
      in_review: "<option-id>"
      done: "<option-id>"

  doc_type:
    id: "<your-doc-type-field-id>"
    options:
      fs: "<option-id>"
      plan: "<option-id>"
      task: "<option-id>"
      bug: "<option-id>"
