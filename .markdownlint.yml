default: true

# Allow arbitrary line length (one-sentence-per-line style)
MD013: false

# Allow duplicate sibling headings (needed for CHANGELOG: Added, Changed, Fixed repeat per release)
MD024: false  # multiple headings (legacy content uses repeated section names)

# Root-level markdown files (AGENTS.md, README.md, INTEGRATION.md, CONTRIBUTING.md,
# CHANGELOG.md) predate the widened lint coverage and contain mechanical whitespace
# issues. Disable the mechanical rules at the root; per-directory configs apply
# elsewhere.
MD022: false  # blanks-around-headings
MD031: false  # blanks-around-fences
MD032: false  # blanks-around-lists
MD040: false  # fenced-code-language
MD010: false  # hard-tabs
MD009: false  # trailing-whitespace
MD041: false  # first-line-h1 (front matter may be absent)
MD012: false  # no-multiple-blanks
MD047: false  # single-trailing-newline
MD033: false  # no-inline-html
MD060: false  # table-column-style
MD007: false  # ul-indent
